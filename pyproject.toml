[project]
name = "swxtch"
version = "0.1.0"
description = "Rotate your Wi-Fi MAC address on Linux, like iOS's Private Wi-Fi Address"
requires-python = ">=3.10"

[project.optional-dependencies]
test = ["pytest>=7.0", "pytest-cov>=4.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "black>=23.0", "ruff>=0.1"]
crypto = ["cryptography>=41.0", "pycryptodome>=3.19", "liboqs-python>=0.9.0"]

[project.scripts]
swxtch = "swxtch.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["swxtch"]
